esson{margin-top:12px}.lesson p,.lesson li{line-height:1.65;color:#c6d5e3}.callout{padding:14px;border-left:4px solid #36c6ae;background:#0a2030;border-radius:10px;margin:12px 0}.question{padding:18px}.option{width:100%;text-align:left;padding:13px;margin:7px 0;border-radius:12px;background:#10283d;color:#eaf4ff;border:1px solid #1c4764}.option.correct{background:#124638;border-color:#36c6ae}.option.wrong{background:#4b2030;border-color:#ff7184}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(4,12,21,.95);backdrop-filter:blur(14px);border-top:1px solid #17314c;display:flex;justify-content:center}.nav{max-width:900px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{padding:9px 4px;background:transparent;color:#8fa8bd;font-size:11px}.nav button.active{color:#5ce0c4}.nav .ico{display:block;font-size:19px;margin-bottom:2px}.pillrow{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.pill{white-space:nowrap;padding:8px 12px;border-radius:999px;background:#0b1c2d;border:1px solid #21445f;color:#a9c0d3}.pill.active{background:#16516a;color:white}.empty{text-align:center;padding:30px;color:#91a8bb}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(900px,100%);max-height:90vh;overflow:auto;background:#081522;border:1px solid #21445f;border-radius:24px 24px 0 0;padding:18px}.close{float:right;background:#17314c;color:white;border-radius:10px;padding:8px 11px}.anatomy{min-height:300px;border-radius:20px;background:radial-gradient(circle,#153b58,#081521 65%);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.bodyshape{font-size:150px;filter:drop-shadow(0 0 20px rgba(85,214,190,.18))}.hotspot{position:absolute;background:#5ce0c4;color:#052018;border-radius:50%;width:30px;height:30px;font-weight:900}.hotspot.h1{top:17%;left:47%}.hotspot.h2{top:40%;left:37%}.hotspot.h3{top:55%;right:30%}.hotspot.h4{bottom:17%;left:48%}.search{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #21445f;background:#081725;color:white;outline:none}.small{font-size:12px}.kpi{font-size:13px;color:#a9bfd2}

'use strict';
var KEY='med_study_v2_clean';
var state=loadState();
function loadState(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)return x}catch(e){}return {xp:0,answered:0,correct:0,streak:1,completed:{},seen:{},favorites:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateTop();}
function updateTop(){var lv=Math.floor(state.xp/100)+1;document.getElementById('topLevel').textContent='Nível '+lv+' • '+state.xp+' XP';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function nav(id){document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-nav')===id)});render(id);window.scrollTo(0,0);}
var subjects={
fundamental:[
{id:'bio',icon:'🧬',name:'Biologia',desc:'Célula, genética, divisão celular e bases da vida',lessons:[['Célula e organização','A célula é a unidade estrutural e funcional básica dos seres vivos. Células procarióticas não possuem núcleo delimitado por membrana; eucarióticas possuem núcleo e organelas membranosas.'],['Membrana e transporte','A membrana plasmática é formada principalmente por uma bicamada de fosfolipídios. Difusão simples, difusão facilitada, osmose e transporte ativo explicam diferentes movimentos de substâncias.'],['Organelas','Mitocôndrias participam da produção de ATP; ribossomos sintetizam proteínas; retículo endoplasmático participa da síntese e processamento; complexo de Golgi modifica e direciona moléculas; lisossomos atuam na digestão intracelular.'],['Mitoses e meiose','A mitose produz células geneticamente semelhantes e é importante para crescimento e reparo. A meiose reduz a ploidia e contribui para a variabilidade genética.'],['Genética básica','DNA armazena informação genética. Genes são segmentos de DNA e variantes podem influenciar características e doenças.'] ]},
{id:'chem',icon:'⚗️',name:'Química',desc:'Átomos, ligações, soluções, pH e química biológica',lessons:[['Átomos e ligações','Prótons e nêutrons ficam no núcleo; elétrons ocupam regiões ao redor. Ligações iônicas envolvem transferência de elétrons; covalentes envolvem compartilhamento.'],['Água e soluções','Água é polar e participa de muitas reações biológicas. Concentração pode ser expressa em mol/L. Diluições podem ser relacionadas por C1V1=C2V2.'],['pH','pH é uma medida logarítmica relacionada à concentração de H+. Em termos simplificados, pH=-log[H+]. Pequenas mudanças de pH podem alterar proteínas e reações.'],['Orgânica essencial','Carbono forma cadeias e grupos funcionais importantes. Álcool, ácido carboxílico, amina e carbonila aparecem em moléculas biológicas.']]},
{id:'phys',icon:'⚡',name:'Física',desc:'Mecânica, pressão, fluidos, energia e eletricidade',lessons:[['Movimento','Velocidade descreve deslocamento por tempo. Aceleração representa a variação da velocidade. Esses conceitos aparecem em biomecânica e fisiologia.'],['Pressão e fluidos','Pressão é força por área. Em fluidos, diferenças de pressão podem gerar fluxo; esse princípio é essencial para compreender circulação e respiração.'],['Energia','Energia pode ser transformada entre formas. Trabalho, potência e conservação de energia ajudam a explicar movimentos e processos fisiológicos.'],['Eletricidade','Corrente elétrica corresponde ao fluxo de carga. Diferenças de potencial impulsionam correntes e conceitos elétricos também aparecem na fisiologia de membranas.']]},
{id:'math',icon:'📐',name:'Matemática',desc:'Razão, proporção, estatística e cálculos usados na saúde',lessons:[['Proporções','Regra de três e proporções aparecem em doses, concentrações e conversões de unidades. Sempre confira as unidades antes do resultado.'],['Porcentagem','Porcentagens ajudam a interpretar risco, prevalência, variações e resultados laboratoriais.'],['Estatística básica','Média resume valores, mediana é o valor central ordenado e desvio-padrão descreve dispersão.'],['Probabilidade','Probabilidade representa incerteza. Em medicina, raciocínio probabilístico ajuda a interpretar testes diagnósticos e riscos.']]},
{id:'anato',icon:'🫀',name:'Anatomia Básica',desc:'Terminologia, planos, regiões e orientação anatômica',lessons:[['Posição anatômica','O corpo é descrito em posição anatômica para padronizar referências. Termos como anterior, posterior, medial, lateral, proximal e distal são fundamentais.'],['Planos e eixos','Planos sagital, frontal e transversal ajudam a descrever cortes e movimentos. Eixos e termos de movimento tornam a comunicação anatômica precisa.'],['Regiões do corpo','Cabeça, pescoço, tórax, abdome, pelve e membros são regiões amplas usadas para localização e estudo.'],['Introdução aos sistemas','Sistemas musculoesquelético, cardiovascular, respiratório, nervoso e outros serão aprofundados nos níveis seguintes.']]},
{id:'histo',icon:'🔬',name:'Histologia',desc:'Tecidos e organização microscópica',lessons:[['Epitélio','Tecidos epiteliais revestem superfícies e formam glândulas. Características incluem organização celular e pouca matriz extracelular.'],['Conjuntivo','Possui células imersas em matriz extracelular. Inclui tecidos como adiposo, cartilaginoso e ósseo.'],['Muscular','Músculo esquelético, cardíaco e liso possuem diferenças estruturais e funcionais.'],['Nervoso','Neurônios transmitem sinais e células da glia sustentam, protegem e modulam o tecido nervoso.']]},
{id:'term',icon:'📖',name:'Terminologia Médica',desc:'Prefixos, sufixos, raízes e linguagem clínica',lessons:[['Como ler termos','Muitos termos médicos combinam raízes, prefixos e sufixos. Identificar as partes ajuda a deduzir o significado.'],['Direção e localização','Cefálico, caudal, medial, lateral, proximal e distal são exemplos de termos usados para localização.'],['Sintomas e sinais','Sintoma é uma experiência relatada pelo paciente; sinal é um achado observável ou mensurável pelo examinador.']]}
],
intermediate:[
{id:'physio',icon:'🫁',name:'Fisiologia',desc:'Como os sistemas funcionam e mantêm a homeostase',lessons:[['Homeostase','O organismo mantém variáveis internas dentro de faixas compatíveis com a vida. Feedback negativo é um mecanismo central dessa estabilidade.'],['Cardiovascular','Débito cardíaco é produto da frequência cardíaca pelo volume sistólico. Pressão arterial depende da interação entre débito cardíaco e resistência vascular.'],['Respiratória','Ventilação move ar; troca gasosa ocorre nos alvéolos. Difusão depende de gradientes e propriedades da membrana.'],['Renal','Rins filtram o plasma, reabsorvem substâncias úteis, secretam outras e regulam água, eletrólitos e equilíbrio ácido-base.']]},
{id:'biochem',icon:'🧪',name:'Bioquímica',desc:'Proteínas, enzimas, metabolismo e energia celular',lessons:[['Proteínas','Aminoácidos formam proteínas. A estrutura tridimensional determina grande parte da função e pode ser alterada por mudanças no ambiente.'],['Enzimas','Enzimas aceleram reações ao reduzir a energia de ativação. Temperatura, pH e concentração podem influenciar sua atividade.'],['ATP e metabolismo','ATP funciona como moeda energética celular. Glicólise, ciclo de Krebs e fosforilação oxidativa integram o metabolismo energético.'],['Carboidratos e lipídios','Carboidratos fornecem energia e também têm funções estruturais. Lipídios participam de membranas, armazenamento energético e sinalização.']]},
{id:'gen',icon:'🧬',name:'Genética',desc:'Hereditariedade, mutações e expressão gênica',lessons:[['DNA e replicação','A dupla hélice permite cópia complementar do material genético. A replicação é semiconservativa.'],['Transcrição e tradução','Genes podem ser transcritos em RNA; o RNA mensageiro pode ser traduzido em proteína pelos ribossomos.'],['Mutações','Mutações podem ser neutras, prejudiciais ou, em alguns contextos, benéficas. O efeito depende do gene, célula e ambiente.'],['Heredogramas','Heredogramas ajudam a reconhecer padrões de herança, como autossômica dominante, recessiva e ligada ao X.']]},
{id:'micro',icon:'🦠',name:'Microbiologia',desc:'Bactérias, vírus, fungos e controle de infecções',lessons:[['Bactérias','Bactérias são procariontes. Parede celular, metabolismo e mecanismos de resistência ajudam a explicar sua interação com o hospedeiro.'],['Vírus','Vírus dependem de células hospedeiras para replicação. Estrutura, genoma e ciclo replicativo variam entre famílias.'],['Fungos','Fungos são eucariontes. Podem causar infecções superficiais, mucosas ou sistêmicas, especialmente em pessoas vulneráveis.'],['Prevenção','Higiene, vacinação quando indicada, esterilização e uso racional de antimicrobianos são pilares de controle de infecções.']]},
{id:'imuno',icon:'🛡️',name:'Imunologia',desc:'Imunidade inata, adaptativa, anticorpos e inflamação',lessons:[['Imunidade inata','É a resposta inicial e inclui barreiras, células e mediadores. Atua rapidamente e reconhece padrões associados a dano ou microrganismos.'],['Imunidade adaptativa','Linfócitos B e T participam da resposta específica. A memória imunológica permite respostas mais rápidas em exposições posteriores.'],['Anticorpos','Anticorpos são imunoglobulinas produzidas por células derivadas de linfócitos B e reconhecem antígenos específicos.'],['Inflamação','Inflamação envolve mediadores que promovem alterações vasculares e recrutamento celular. É útil na defesa, mas pode causar dano quando desregulada.']]},
{id:'parasito',icon:'🪱',name:'Parasitologia',desc:'Protozoários, helmintos, ciclos e prevenção',lessons:[['Conceitos','Parasitas dependem de hospedeiros para parte de seu ciclo. Vetores podem participar da transmissão de algumas doenças.'],['Protozoários','São eucariontes unicelulares. Diferentes espécies podem ter ciclos complexos e manifestações clínicas distintas.'],['Helmintos','Incluem nematódeos, cestódeos e trematódeos. Conhecer ciclo e via de transmissão orienta diagnóstico e prevenção.'],['Prevenção','Saneamento, água segura, higiene, controle de vetores e tratamento adequado reduzem transmissão.']]},
{id:'embrio',icon:'👶',name:'Embriologia',desc:'Fecundação, gastrulação e desenvolvimento',lessons:[['Fecundação','A união dos gametas forma o zigoto. Divisões celulares iniciais levam à formação de estruturas embrionárias.'],['Gastrulação','A gastrulação estabelece camadas germinativas que originam diferentes tecidos e órgãos.'],['Neurulação','Processos embrionários formam o tubo neural, estrutura relacionada ao desenvolvimento do sistema nervoso central.']]}
],
advanced:[
{id:'path',icon:'🧫',name:'Patologia',desc:'Lesão celular, inflamação, neoplasias e doenças',lessons:[['Lesão celular','Células podem sofrer adaptação, lesão reversível ou irreversível. Hipóxia, toxinas e estresse podem alterar sua função.'],['Inflamação aguda','Caracteriza-se por alterações vasculares e recrutamento de leucócitos, frequentemente com neutrófilos predominando inicialmente.'],['Inflamação crônica','Pode envolver macrófagos, linfócitos e remodelamento tecidual. Persistência do estímulo mantém o processo.'],['Neoplasias','Neoplasias envolvem proliferação celular desregulada. Benignidade e malignidade têm critérios clínicos e anatomopatológicos distintos.']]},
{id:'pharm',icon:'💊',name:'Farmacologia',desc:'Farmacocinética, farmacodinâmica e fármacos',lessons:[['Farmacocinética','ADME resume absorção, distribuição, metabolismo e excreção. A via de administração altera exposição ao fármaco.'],['Farmacodinâmica','Estuda efeitos dos fármacos e sua relação com receptores e outros alvos. Agonistas ativam receptores; antagonistas bloqueiam sua ação.'],['Dose e segurança','Efeito terapêutico e efeitos adversos precisam ser equilibrados. Dose, intervalo e função renal/hepática influenciam segurança.'],['Interações','Fármacos podem alterar absorção, metabolismo, excreção ou efeitos de outros fármacos.']]},
{id:'neuro',icon:'🧠',name:'Neurociência',desc:'Neurônios, sinapses, vias e integração',lessons:[['Neurônio','Neurônios recebem, processam e transmitem sinais. Dendritos e soma participam da recepção; axônio conduz o potencial de ação.'],['Potencial de ação','Alterações rápidas do potencial de membrana dependem principalmente do fluxo de íons por canais específicos.'],['Sinapses','Sinapses podem ser químicas ou elétricas. Neurotransmissores mediam comunicação em muitas sinapses químicas.'],['Vias','Sistemas sensoriais e motores possuem vias organizadas; lesões em locais diferentes podem produzir déficits característicos.']]},
{id:'semiology',icon:'🩺',name:'Semiologia',desc:'Anamnese, exame físico e raciocínio clínico',lessons:[['Anamnese','A história clínica organiza queixa principal, história da doença atual, antecedentes, medicamentos, hábitos e revisão de sistemas.'],['Sinais vitais','Temperatura, frequência cardíaca, frequência respiratória, pressão arterial e saturação ajudam a avaliar estado fisiológico.'],['Exame físico','Inspeção, palpação, percussão e ausculta são técnicas fundamentais, aplicadas de acordo com o sistema avaliado.'],['Raciocínio','O diagnóstico diferencial combina história, exame físico e exames complementares, sempre considerando probabilidade pré-teste.']]},
{id:'clinmed',icon:'🏥',name:'Introdução à Clínica',desc:'Integração de sintomas, exames e hipóteses',lessons:[['Raciocínio clínico','Comece pela definição do problema, organize achados e formule hipóteses. Depois, busque dados que discriminem entre hipóteses.'],['Exames','Nenhum exame deve ser interpretado isoladamente. Sensibilidade, especificidade e contexto alteram o significado de um resultado.'],['Segurança','Condutas clínicas reais exigem supervisão, protocolos locais e avaliação individual. O conteúdo desta plataforma é educacional.']]}
]};
var questions=[
{level:'fundamental',subject:'Biologia',q:'Qual estrutura celular é diretamente responsável pel
