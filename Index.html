<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MED STUDY V1</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fb;font-family:system-ui,Arial}.top{position:sticky;top:0;background:#0a1727ee;border-bottom:1px solid #20344d;padding:14px;z-index:5}.top b{font-size:20px}.top b i{color:#43d5c5;font-style:normal}.nav{display:flex;gap:7px;overflow:auto;margin-top:10px}.nav button,.btn{border:1px solid #28415b;background:#11243a;color:#fff;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.nav button:hover,.btn:hover{border-color:#43d5c5}.primary{background:#43d5c5;color:#04151a;border:0}.danger{background:#d95767;border:0}.wrap{max-width:1100px;margin:auto;padding:22px 14px 60px}.hero{padding:18px 0}.hero h1{font-size:clamp(32px,7vw,56px);margin:8px 0}.muted{color:#9fb0c3;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#0d1c2e;border:1px solid #203750;border-radius:18px;padding:18px;box-shadow:0 12px 30px #0004}.choice{min-height:230px}.tag{display:inline-block;background:#17344c;color:#aee8ff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.row{display:flex;gap:9px;flex-wrap:wrap}.bar{height:8px;background:#06111d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#43d5c5}.q{max-width:820px;margin:auto}.answer{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border-radius:12px;border:1px solid #28415b;background:#11243a;color:#fff;cursor:pointer}.ok{border-color:#43d483!important;background:#103525!important}.bad{border-color:#ff6577!important;background:#391b24!important}.result{text-align:center}.score{font-size:55px;color:#43d5c5;font-weight:900}.anatomy{display:grid;grid-template-columns:1fr 1fr;gap:15px}.diagram{min-height:330px;background:#09192a;border:1px solid #29415b;border-radius:18px;display:grid;place-items:center}.diagram svg{width:92%;max-height:310px}.node{cursor:pointer}.node circle{fill:#43d5c5;stroke:white;stroke-width:1}.node:hover circle{fill:#ffd166}.lesson{border:1px solid #223b55;border-radius:15px;padding:15px;margin:10px 0;background:#0a192a}.small{font-size:13px}.hidden{display:none}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.anatomy,.grid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.wrap{padding:15px 11px 45px}.card{padding:15px}}
</style></head><body><header class="top"><b>MED <i>STUDY</i></b><nav class="nav"><button onclick="show('home')">Início</button><button onclick="show('vest')">Vestibular</button><button onclick="show('med')">Medicina</button><button onclick="show('questions')">Questões</button><button onclick="show('challenges')">Desafios</button><button onclick="show('anatomy')">Anatomia</button><button onclick="show('progress')">Progresso</button></nav></header><main id="app" class="wrap"></main><script>
const S={view:'home',subject:null,q:0,challenge:0,cc:0,ca:false};const Q={
'Biologia Celular':[{q:'Qual estrutura controla seletivamente a entrada e saída de substâncias?',a:['Núcleo','Membrana plasmática','Ribossomo','Nucléolo'],c:1},{q:'Qual organela participa diretamente da síntese de proteínas?',a:['Lisossomo','Golgi','Ribossomo','Centríolo'],c:2},{q:'Células procarióticas não possuem:',a:['DNA','Ribossomos','Membrana','Núcleo delimitado por membrana'],c:3},{q:'A principal função das mitocôndrias está ligada à produção de:',a:['ATP','Anticorpos','Bile','Colágeno'],c:0},{q:'Transcrição é a formação de:',a:['DNA a partir de proteína','RNA a partir de DNA','ATP a partir de lipídio','Glicogênio a partir de RNA'],c:1}],
'Anatomia I':[{q:'Estrutura próxima à linha média é descrita como:',a:['Lateral','Medial','Distal','Superficial'],c:1},{q:'Qual é o maior osso do corpo?',a:['Tíbia','Úmero','Fêmur','Rádio'],c:2},{q:'Qual câmara bombeia sangue para a circulação sistêmica?',a:['Átrio direito','Ventrículo direito','Átrio esquerdo','Ventrículo esquerdo'],c:3},{q:'A traqueia pertence principalmente ao sistema:',a:['Digestório','Respiratório','Urinário','Endócrino'],c:1}],
'Bioquímica':[{q:'O pH está relacionado principalmente à concentração de:',a:['O₂','H+','Glicose','Sódio'],c:1},{q:'Glicogênio é principalmente:',a:['Hormônio','Reserva de glicose','Anticorpo','Ácido nucleico'],c:1}],
'Fisiologia I':[{q:'Homeostase significa:',a:['Ausência de mudanças','Manutenção dinâmica do meio interno','Paralisação metabólica','Produção contínua de hormônios'],c:1},{q:'Feedback negativo tende a:',a:['Amplificar a alteração','Reduzir a alteração inicial','Eliminar receptores','Parar o metabolismo'],c:1}]};
const lessons={
'Biologia Celular':[['O que é uma célula?','A célula é a unidade estrutural e funcional básica dos seres vivos. Diferencie procariontes e eucariontes e relacione organização celular com função.',['Teoria celular','Procariontes × eucariontes','Organelas','Estrutura e função']],['Membrana plasmática','A membrana delimita a célula e controla trocas. Estude bicamada lipídica, proteínas, permeabilidade seletiva, difusão e transporte ativo.',['Bicamada fosfolipídica','Proteínas','Difusão','Transporte ativo']],['Núcleo e DNA','O núcleo e a cromatina organizam grande parte da informação genética. Relacione replicação, transcrição e expressão gênica.',['DNA','Cromatina','Replicação','Transcrição']],['Organelas','Mitocôndrias, ribossomos, retículo, Golgi e lisossomos executam funções especializadas que podem ser relacionadas a doenças e medicamentos.',['Mitocôndria','Ribossomo','Retículo','Golgi','Lisossomo']]],
'Anatomia I':[['Posição anatômica','A posição anatômica padroniza a comunicação médica. Estude planos, eixos e termos como medial, lateral, proximal, distal, anterior e posterior.',['Posição anatômica','Planos','Eixos','Termos direcionais']],['Sistema esquelético','O esqueleto sustenta, protege e fornece pontos de fixação muscular. Memorize os principais ossos e sua localização.',['Crânio','Coluna','Tórax','Membros superiores','Membros inferiores']],['Sistema cardiovascular','O coração possui quatro câmaras e válvulas que direcionam o fluxo. Estude circulação pulmonar e sistêmica.',['Átrios','Ventrículos','Válvulas','Aorta','Veias cavas']]],
'Bioquímica':[['Água, pH e tampões','Água participa de reações biológicas. pH expressa uma relação com H+ e sistemas tampão ajudam a resistir a variações.',['Água','pH','Ácidos e bases','Tampões']],['Carboidratos','Glicose e glicogênio têm papel energético. Relacione glicólise, armazenamento e utilização de substratos.',['Glicose','Glicogênio','Glicólise','Energia']]],
'Fisiologia I':[['Homeostase','Homeostase é manutenção dinâmica de variáveis internas. Estude sensores, integração, efetores e feedback.',['Variáveis internas','Feedback negativo','Feedback positivo','Controle']],['Potencial de membrana','Gradientes iônicos e permeabilidade seletiva produzem diferenças elétricas importantes para neurônios e músculos.',['Íons','Repouso','Canais','Potencial de ação']]]};
const periods=[['1º','Fundamentos','Biologia Celular','Bioquímica','Anatomia I','Histologia','Embriologia'],['2º','Estrutura e função','Anatomia II','Fisiologia I','Genética','Bioquímica II','Imunologia'],['3º','Sistemas','Fisiologia II','Microbiologia','Parasitologia','Neuroanatomia','Patologia Geral'],['4º','Bases clínicas','Farmacologia','Patologia Especial','Semiologia I','Epidemiologia','Saúde Coletiva'],['5º','Habilidades clínicas','Semiologia II','Propedêutica','Procedimentos Básicos','Farmacologia Clínica','Diagnóstico'],['6º','Clínica médica','Clínica Médica I','Pediatria I','Cirurgia I','Ginecologia I','Infectologia'],['7º','Clínica integrada','Clínica Médica II','Pediatria II','Cirurgia II','Ginecologia II','Neurologia'],['8º','Especialidades','Cardiologia','Pneumologia','Nefrologia','Endocrinologia','Psiquiatria'],['9º','Internato','Enfermaria','Ambulatório','Urgência','Atenção Primária','Discussão de Casos'],['10º','Integração','Urgência e Emergência','Clínica Integrada','Medicina de Família','Ética Médica','Preparação Profissional']];
const vests=['Matemática','Português','Biologia','Química','Física','História','Geografia','Filosofia','Sociologia','Literatura','Inglês/Espanhol','Redação'];
const challenges=[['🟢 Básico','Fundamentos',0],['🟡 Intermediário','Integração fisiológica',20],['🟠 Avançado','Bases patológicas',45],['🔴 Faculdade / Clínico','Raciocínio clínico',65]];
function save(){localStorage.setItem('medstudy_v1',JSON.stringify(S))}function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('medstudy_v1')||'{}'))}catch(e){}}load();
function btn(t,fn,cl=''){return `<button class="btn ${cl}" onclick="${fn}">${t}</button>`}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(v){S.view=v;save();render();scrollTo(0,0)}
function home(){return `<section class="hero"><span class="tag">MED STUDY • V1</span><h1>Seu caminho até a Medicina.</h1><p class="muted">Duas trilhas separadas: preparação para vestibular e visão completa da formação médica. A estrutura foi feita para crescer sem misturar estudos, questões e desafios.</p></section><div class="grid"><article class="card choice"><h2>🎯 Vestibular</h2><p class="muted">Prepare-se para ENEM e vestibulares com Linguagens, Matemática, Natureza, Humanas e Redação.</p>${btn('Entrar →',"show('vest')",'primary')}</article><article class="card choice"><h2>🩺 Depois que passei</h2><p class="muted">Explore os 10 períodos, matérias, anatomia, fisiologia, clínica e habilidades práticas.</p>${btn('Explorar →',"show('med')",'primary')}</article></div><div class="card" style="margin-top:15px"><h3>📊 Resumo</h3>${stats()}</div>`}
function stats(){return `<div class="grid"><div><b>XP</b><div class="score" style="font-size:32px">${S.xp||0}</div></div><div><b>Questões respondidas</b><p class="muted">Por matéria, com posição separada.</p></div></div>`}
function vest(){return `<div class="row"><h2 style="flex:1">🎯 Vestibular / ENEM</h2>${btn('← Início',"show('home')")}</div><p class="muted">A V1 deixa a estrutura pronta para uma apostila muito extensa e para simulados completos.</p><div class="cards">${vests.map(x=>`<article class="card"><span class="tag">MATÉRIA</span><h3>${x}</h3><p class="muted">Conteúdo, aulas, revisão e banco de questões específico.</p>${btn('Estudar',`openSub('${x}')`)} ${btn('Questões',`startQ('${x}')`,'')}</article>`).join('')}</div>`}
function med(){return `<div class="row"><h2 style="flex:1">🩺 Formação em Medicina</h2>${btn('← Início',"show('home')")}</div><p class="muted">Modelo de 10 períodos baseado em uma progressão comum. A grade real varia entre universidades.</p><div class="cards">${periods.map((p,i)=>`<article class="card"><span class="tag">${p[0]}º PERÍODO</span><h3>${p[1]}</h3><p class="muted">${p.slice(2).join(' • ')}</p>${btn('Ver matérias',`showPeriod(${i})`)}</article>`).join('')}</div><div class="card" style="margin-top:15px"><h3>🦴 Anatomia Interativa</h3><p class="muted">Diagramas clicáveis, identificação de estruturas, flashcards e quiz visual.</p>${btn('Abrir Anatomia',"show('anatomy')",'primary')}</div>`}
function showPeriod(i){S.period=i;show('period')}
function period(){let p=periods[S.period||0];return `<div class="row"><h2 style="flex:1">📚 ${p[0]}º período — ${p[1]}</h2>${btn('← Medicina',"show('med')")}</div><div class="cards">${p.slice(2).map(x=>`<article class="card"><h3>${x}</h3><p class="muted">Aulas completas, revisão, flashcards e questões próprias desta matéria.</p>${btn('Abrir matéria',`openSub('${x}')`)} ${btn('Questões',`startQ('${x}')`)}</article>`).join('')}</div>`}
function openSub(name){S.subject=name;S.lesson=0;show('subject')}
function subject(){let name=S.subject,L=lessons[name]||[['Introdução a '+name,'Esta matéria será dividida em aulas completas, com conceito, mecanismo, exemplos, aplicação clínica, revisão, flashcards e questões.',['Objetivos','Conceitos fundamentais','Aplicação','Revisão']],['Fundamentos','Estude os termos essenciais e relacione-os a situações práticas.',['Definições','Mecanismos','Exemplos','Erros comuns']],['Revisão ativa','Explique o conteúdo sem consultar o texto e depois teste seu conhecimento.',['Recuperação ativa','Questões','Flashcards','Síntese']]];return `<div class="row"><h2 style="flex:1">📖 ${esc(name)}</h2>${btn('← Voltar',"S.period!=null?show('period'):show('vest')")}</div><p class="muted">O que você verá • ${L.length} aulas. Nenhuma aula deve ser apenas duas linhas.</p>${L.map((l,i)=>`<article class="lesson"><span class="tag">AULA ${i+1}</span><h3>${esc(l[0])}</h3><p class="muted">${esc(l[1])}</p><p><b>Você precisa dominar:</b> ${l[2].map(esc).join(' • ')}</p>${btn('Estudar aula completa',`lesson(${i})`)} ${btn('Questões',`startQ('${name}')`)}</article>`).join('')}`}
function lesson(i){S.lesson=i;show('lesson')}
function lessonView(){let L=(lessons[S.subject]||[])[S.lesson||0];return `<div class="row"><h2 style="flex:1">📖 Aula ${S.lesson+1} — ${esc(L[0])}</h2>${btn('← Matéria',"show('subject')")}</div><article class="card"><h3>Conceito</h3><p class="muted" style="font-size:17px">${esc(L[1])}</p><h3>O que você precisa dominar</h3><ul>${L[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>💡 Como estudar</h3><p class="muted">Explique o mecanismo com suas palavras, faça uma comparação, crie um exemplo e depois responda questões. Na versão completa, cada aula terá texto aprofundado, imagens, flashcards e casos.</p><div class="row">${S.lesson<(lessons[S.subject]||[]).length-1?btn('Próxima aula →',`lesson(${S.lesson+1})`):btn('✓ Voltar à matéria',"show('subject')")}${btn('🧠 Fazer questões',`startQ('${S.subject}')`,'primary')}</div></article>`}
function qBank(name){return Q[name]||[{q:`Qual estratégia é mais adequada para estudar ${name}?`,a:['Decorar sem entender','Relacionar conceitos e praticar recuperação ativa','Estudar somente na véspera','Evitar questões'],c:1},{q:`Ao estudar ${name}, uma boa revisão deve:`,a:['Ser apenas releitura','Retomar conceitos e testar a memória','Ignorar erros','Trocar de matéria imediatamente'],c:1},{q:'Em uma questão acadêmica, é importante:',a:['Ler só as alternativas','Relacionar enunciado e conceitos','Escolher sempre A','Ignorar dados'],c:1},{q:'Qual estratégia favorece retenção?',a:['Revisão espaçada','Uma única leitura','Estudar sem pausas por dias','Evitar recuperação'],c:0}]}
function startQ(name){S.subject=name;if(!S.qpos)S.qpos={};if(S.qpos[name]==null)S.qpos[name]=0;S.qAnswered=false;show('questions')}
function questions(){if(!S.subject)return `<div class="row"><h2 style="flex:1">🧠 Questões</h2>${btn('← Início',"show('home')")}</div><div class="cards">${[...vests,'Biologia Celular','Anatomia I','Bioquímica','Fisiologia I'].map(x=>`<article class="card"><h3>${x}</h3><p class="muted">Banco independente. Sua posição fica salva por matéria.</p>${btn('Começar / continuar',`startQ('${x}')`,'primary')}</article>`).join('')}</div>`;let B=qBank(S.subject),i=S.qpos[S.subject]||0,q=B[i%B.length];return `<div class="row"><h2 style="flex:1">🧠 ${esc(S.subject)}</h2>${btn('← Matérias',"S.subject=null;show('questions')")}</div><div class="q card"><span class="tag">QUESTÃO ${i+1} / ${B.length}</span><h2>${esc(q.q)}</h2>${q.a.map((x,k)=>`<button class="answer" onclick="answer(${k})">${String.fromCharCode(65+k)}) ${esc(x)}</button>`).join('')}<div id="feedback"></div></div>`}
function answer(k){if(S.qAnswered)return;S.qAnswered=true;let B=qBank(S.subject),i=S.qpos[S.subject]||0,q=B[i%B.length],ok=k===q.c;S.xp=(S.xp||0)+(ok?10:0);document.querySelectorAll('.answer').forEach((b,n)=>{b.disabled=true;if(n===q.c)b.classList.add('ok');if(n===k&&!ok)b.classList.add('bad')});document.getElementById('feedback').innerHTML=`<div class="card" style="margin-top:12px"><b>${ok?'✅ Correto!':'❌ Incorreto.'}</b><p class="muted">${ok?'Boa. Continue.':'Revise o conceito e tente novamente depois.'}</p>${i<B.length-1?btn('Próxima questão →',`nextQ()`,'primary'):btn('🏁 Finalizar bloco',`finishQ()`,'primary')}</div>`;save()}
function nextQ(){S.qpos[S.subject]=(S.qpos[S.subject]||0)+1;S.qAnswered=false;save();render()}
function finishQ(){S.qpos[S.subject]=0;S.qAnswered=false;save();show('questions')}
function challengesView(){return `<div class="row"><h2 style="flex:1">🔥 Desafios</h2>${btn('← Início',"show('home')")}</div><p class="muted">Cada nível prepara para o próximo. A versão final terá bancos grandes, questões inéditas e sem repetição imediata.</p><div class="cards">${challenges.map((c,i)=>`<article class="card"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p class="muted">5 questões na V1. Recomendação: ${c[2]}% de domínio anterior.</p>${btn('Iniciar',`startC(${i})`,'primary')}</article>`).join('')}</div>`}
const cq=[['Qual organela está ligada à produção de ATP?',['Golgi','Mitocôndria','Lisossomo','Nucléolo'],1],['Qual termo significa próximo da linha média?',['Lateral','Medial','Distal','Posterior'],1],['O feedback negativo tende a:',['Amplificar','Reduzir a alteração inicial','Eliminar receptores','Parar metabolismo'],1],['O ventrículo esquerdo envia sangue para:',['Pulmões','Circulação sistêmica','Veia cava','Átrio direito'],1],['A farmacodinâmica estuda:',['O que o fármaco faz no organismo','Somente absorção','Somente excreção','Somente distribuição'],0]];
function startC(i){S.challenge=i;S.cq=0;S.cc=0;S.ca=false;show('challengePlay')}
function challengePlay(){let q=cq[S.cq];return `<div class="row"><h2 style="flex:1">${challenges[S.challenge][0]} ${challenges[S.challenge][1]}</h2>${btn('Sair',"show('challenges')")}</div><div class="q card"><span class="tag">QUESTÃO ${S.cq+1} / ${cq.length}</span><h2>${q[0]}</h2>${q[1].map((x,k)=>`<button class="answer" onclick="answerC(${k})">${String.fromCharCode(65+k)}) ${x}</button>`).join('')}<div id="feedback"></div></div>`}
function answerC(k){if(S.ca)return;S.ca=true;let q=cq[S.cq],ok=k===q[2];if(ok){S.cc++;S.xp=(S.xp||0)+25}document.querySelectorAll('.answer').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('ok');if(n===k&&!ok)b.classList.add('bad')});document.getElementById('feedback').innerHTML=`<div class="card" style="margin-top:12px"><b>${ok?'✅ Correto!':'❌ Incorreto.'}</b>${S.cq<cq.length-1?btn('Próxima →','nextC()','primary'):btn('🏁 Finalizar desafio','challengeDone()','primary')}</div>`;save()}
function nextC(){S.cq++;S.ca=false;render()}function challengeDone(){show('challengeResult')}function challengeResult(){let p=Math.round(S.cc/cq.length*100);return `<section class="card result"><div class="tag">${challenges[S.challenge][0]}</div><h1>🏁 DESAFIO FINALIZADO!</h1><div class="score">${p}%</div><h2>${S.cc} / ${cq.length} acertos</h2><p class="muted">${p>=80?'Excelente. Você pode avançar.':p>=60?'Bom resultado. Revise os erros antes de avançar.':'Recomendação: revise o conteúdo e refaça o desafio.'}</p><div class="row" style="justify-content:center">${btn('🔄 Tentar novamente',`startC(${S.challenge})`)}${btn('📚 Revisar',"show('questions')")}${btn('⬅️ Voltar',"show('challenges')")}</div></section>`}
const groups={Skeletal:['Crânio','Clavícula','Úmero','Rádio','Fêmur'],Muscular:['Deltoide','Bíceps','Tríceps','Peitoral maior','Quadríceps'],Cardiovascular:['Átrio direito','Ventrículo direito','Átrio esquerdo','Ventrículo esquerdo','Aorta'],Respiratory:['Traqueia','Brônquios','Pulmões','Alvéolos','Diafragma'],Nervous:['Cérebro','Cerebelo','Tronco encefálico','Medula espinal','Lobos cerebrais']};let G='Nervous',P=0;
function anatomy(){let arr=groups[G],name=arr[P];return `<div class="row"><h2 style="flex:1">🫀 Anatomia Interativa</h2>${btn('← Início',"show('home')")}</div><div class="row">${Object.keys(groups).map(x=>btn(x,x===G?'noop':`G='${x}';P=0;render()`)).join('')}</div><div class="anatomy" style="margin-top:15px"><div class="diagram"><svg viewBox="0 0 100 100"><circle cx="50" cy="16" r="
